# Production profile: activate with SPRING_PROFILES_ACTIVE=prod (or --spring.profiles.active=prod).
# All credentials and public URLs must come from environment variables:
#   DB_URL, DB_USERNAME, DB_PASSWORD, APP_JWT_SECRET, APP_BASE_URL (must be https://)

# Schema is validated, never modified by Hibernate; structure changes go through Flyway.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# The development user seeder can never run in production (also enforced in code).
app.dev-user.enabled=false

# API documentation is not exposed publicly in production.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
