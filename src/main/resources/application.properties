spring.application.name=URL

server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/urlshortener}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Flyway is enabled only by the prod profile (see application-prod.properties).
# Local development keeps the existing Hibernate-managed schema behaviour.
spring.flyway.enabled=false

app.dev-user.enabled=${APP_DEV_USER_ENABLED:true}
app.dev-user.email=${APP_DEV_USER_EMAIL:dev@example.com}


app.base-url=${APP_BASE_URL:http://localhost:8080}

# No default secret: development generates an ephemeral one, production refuses to start
# unless APP_JWT_SECRET is provided (see ProductionEnvironmentValidator / JwtService).
app.jwt.secret=${APP_JWT_SECRET:}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}


springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
